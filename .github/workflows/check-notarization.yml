name: Check pending notarizations
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional pending release tag; empty checks all drafts
        type: string
        default: ""
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ""
    secrets:
      APPLE_NOTARY_KEY_P8_BASE64:
        required: true
      APPLE_NOTARY_KEY_ID:
        required: true
      APPLE_NOTARY_ISSUER_ID:
        required: true
permissions:
  contents: read
jobs:
  check:
    if: github.repository == 'tscircuit/tscircuit-standalone' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    outputs:
      ready: ${{ steps.scan.outputs.ready }}
      errors: ${{ steps.scan.outputs.errors }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Query Apple for existing submissions
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: bun scripts/release-queue.ts scan
  finalize:
    needs: check
    if: needs.check.outputs.ready != '' && needs.check.outputs.ready != '[]'
    strategy:
      fail-fast: false
      matrix:
        release_tag: ${{ fromJSON(needs.check.outputs.ready) }}
    uses: ./.github/workflows/finalize-release.yml
    permissions:
      contents: write
      actions: read
    with:
      release_tag: ${{ matrix.release_tag }}
    secrets:
      APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
  report-errors:
    needs: check
    if: needs.check.outputs.errors == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Some releases could not be checked or were rejected; see the check job summary."
          exit 1
