name: Stop obsolete installer diagnostic
on:
  push:
    branches: [diagnose/windows-installer-hang-47]
    paths: [.github/workflows/cancel-installer-diagnostics.yml]
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Stop only the obsolete diagnostic run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          repository = os.environ["GITHUB_REPOSITORY"]
          if repository != "tscircuit/tscircuit-standalone":
              raise RuntimeError("Unexpected repository")
          headers = {"Authorization": "Bearer " + os.environ["GITHUB_TOKEN"],
                     "Accept": "application/vnd.github+json",
                     "X-GitHub-Api-Version": "2022-11-28"}
          run_id = 41860126835
          url = f"https://api.github.com/repos/{repository}/actions/runs/{run_id}"
          request = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(request, timeout=20) as response:
              run = json.load(response)
          print("Diagnostic", run_id, run["status"], run["head_sha"])
          if run["head_branch"] != "diagnose/windows-installer-hang-47" or run["head_sha"] != "130f251bcb9d28891bb08c69c7835e9eca82735b":
              raise RuntimeError("Refusing to cancel an unexpected run")
          if run["status"] != "completed":
              request = urllib.request.Request(url + "/force-cancel", data=b"", headers=headers, method="POST")
              with urllib.request.urlopen(request, timeout=20) as response:
                  print("Cancellation accepted:", response.status)
          PY
