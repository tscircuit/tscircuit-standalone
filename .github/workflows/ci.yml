name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tscircuit_version:
        description: Optional upstream version to qualify without publishing
        required: false
        type: string
      windows_signing_test:
        description: Sign and verify the Windows build using the protected signing environment
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  bundled-bun-runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Test embedded cache and shell scope without system runtimes or external downloads
        run: bun test tests/internal-bun.test.ts tests/bun-shell.test.ts

  build:
    uses: ./.github/workflows/build.yml
    with:
      tscircuit_version: ${{ inputs.tscircuit_version || '' }}
      windows_only: ${{ inputs.windows_signing_test || false }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Cache Bun package downloads
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.4-${{ inputs.tscircuit_version || 'pinned' }}-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-1.4.4-
      - name: Prepare the selected tscircuit version
        if: inputs.tscircuit_version != ''
        env:
          TSCIRCUIT_VERSION: ${{ inputs.tscircuit_version }}
        run: bun scripts/prepare-release.ts "$TSCIRCUIT_VERSION"
      - run: bun install --frozen-lockfile
      - name: Build the prototype UI used by the regression tests
        run: bun run build:ui
      - run: bun run typecheck
      - run: bun run test

  macos-tests:
    needs: build
    runs-on: ${{ matrix.runner }}
    if: ${{ !inputs.windows_signing_test }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Cache Bun package downloads
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.4.4-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-1.4.4-
      - run: bun install --frozen-lockfile
      - name: Test native macOS packaging and installer regression cases
        run: bun run test tests/build-macos-installer.test.ts tests/install-macos.test.ts
      - uses: actions/download-artifact@v4
        with:
          name: tscircuit-standalone-bun-darwin-${{ matrix.arch }}
          path: macos-release
      - name: Verify the native compiled executable starts
        env:
          ARCH: ${{ matrix.arch }}
          EXPECTED_VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir -p dist
          tar -xzf "macos-release/tscircuit-standalone-macos-$ARCH.tar.gz" -C dist
          test "$(./dist/tsci --version)" = "$EXPECTED_VERSION"
          ./dist/tsci --help
      - name: Verify package operations use the bundled Bun runtime
        run: bun scripts/smoke-internal-bun.ts dist/tsci

  windows-signing-checks:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Check signing scripts and reject unsigned code
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($source in (Get-ChildItem -Path scripts,tests -Filter *.ps1 -Recurse)) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($source.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
          $unsigned = Join-Path $env:RUNNER_TEMP "unsigned-signature-check.ps1"
          Set-Content -LiteralPath $unsigned -Value "Write-Output unsigned"
          $rejected = $false
          try { ./scripts/verify-windows-signature.ps1 -Path $unsigned | Out-Null }
          catch { $rejected = $true }
          if (!$rejected) { throw "Unsigned code was accepted" }
      - name: Test valid, wrong-publisher and tampered Authenticode signatures
        shell: pwsh
        run: ./tests/windows-signature.ps1 -Path (Get-Process -Id $PID).Path -ExpectedPublisher 'Microsoft Corporation'
      - name: Test signing dependency retries and failure handling
        shell: pwsh
        run: ./tests/windows-signing-setup.ps1
      - name: Test the Windows curl installer and signature verification
        shell: pwsh
        run: ./tests/windows-bootstrap.test.ps1
      - name: Test the Windows installer command in Windows PowerShell 5.1
        shell: powershell
        run: ./tests/windows-bootstrap.test.ps1
      - name: Test bounded installer process waits
        shell: pwsh
        run: ./tests/windows-installer-process.test.ps1
      - name: Test bounded installer process waits in Windows PowerShell 5.1
        shell: powershell
        run: ./tests/windows-installer-process.test.ps1
      - name: Cache the pinned Microsoft signing module
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/Documents/PowerShell/Modules/ArtifactSigning/0.1.8
          key: windows-ArtifactSigning-0.1.8
      - name: Verify signing dependencies install without signing credentials
        shell: pwsh
        run: ./scripts/install-windows-signing.ps1

  sign-windows-test:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_signing_test
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/sign-windows.yml
    with:
      version: ${{ needs.build.outputs.version }}
  windows-installer:
    if: ${{ !inputs.windows_signing_test }}
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@v4
        with:
          name: tscircuit-standalone-bun-windows-x64
          path: windows-release
      - name: Restore the qualified Windows executable and notices
        shell: pwsh
        run: Expand-Archive windows-release/tscircuit-standalone-windows-x64.zip -DestinationPath dist
      - name: Verify package operations use the bundled Bun runtime
        run: bun scripts/smoke-internal-bun.ts dist/tsci.exe
      - name: Install the checksum-pinned Inno Setup compiler
        shell: pwsh
        run: ./scripts/windows-installer/install-compiler.ps1 -Destination "$env:RUNNER_TEMP/InnoSetup"
      - name: Build the standard Windows installer
        shell: pwsh
        run: |
          $version = & ./dist/tsci.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'The qualified Windows executable did not start' }
          "WINDOWS_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          bun scripts/build-windows-installer.ts dist/tsci.exe "$version" dist/release/tscircuit-standalone-windows-x64-setup.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer compilation failed' }
      - name: Verify install, existing npm commands, upgrades, rollback and uninstall
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/windows-installer/smoke.ps1 -Installer dist/release/tscircuit-standalone-windows-x64-setup.exe -Binary dist/tsci.exe -Version "$env:WINDOWS_RELEASE_VERSION" -DiagnosticsDirectory "$env:RUNNER_TEMP/windows-installer-diagnostics"
      - name: Save Windows installer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-diagnostics
          path: ${{ runner.temp }}/windows-installer-diagnostics
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-installer
          path: dist/release/tscircuit-standalone-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 3
