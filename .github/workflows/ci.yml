name: Check standalone preparation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tscircuit_version:
        description: Optional upstream version to qualify without publishing
        required: false
        type: string
      windows_signing_test:
        description: Sign and verify the Windows build using the protected signing environment
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      tscircuit_version:
        description: Upstream tscircuit version to prepare for a daily release
        required: false
        type: string
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Prepare the selected tscircuit release
        if: inputs.tscircuit_version != ''
        env:
          TSCIRCUIT_VERSION: ${{ inputs.tscircuit_version }}
        run: bun scripts/prepare-release.ts "$TSCIRCUIT_VERSION"
      - run: bun install --frozen-lockfile
      - name: Record the selected version
        id: version
        run: |
          version="$(bun -p 'require("./package.json").version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: bun run check
      - name: Install the qualification browser
        run: bunx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/build/playwright
      - name: Verify 3D STEP rendering, JS CDN modules and WASM with only loopback networking
        run: |
          sudo unshare --net env PATH="$PATH" PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" CI_BROWSER_USER="$(id -un)" sh -c 'ip link set lo up; exec runuser -u "$CI_BROWSER_USER" -- env PATH="$PATH" PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" bun scripts/smoke-binary.ts --browser'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/build/playwright
      - name: Save the qualified dependencies and JS CDN for all target builds
        uses: actions/upload-artifact@v4
        with:
          name: standalone-build-inputs
          path: |
            package.json
            ui/package.json
            bun.lock
            lib/generated-jscdn-assets.ts
            lib/generated-baked-assets.ts
            build/baked-asset-server
            build/jscdn
            build/jscdn-metafile.json
          if-no-files-found: error
          retention-days: 3

  sign-windows-test:
    if: github.event_name == 'workflow_dispatch' && inputs.windows_signing_test
    needs: [check, build-targets]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/sign-windows.yml
    with:
      version: ${{ needs.check.outputs.version }}
  build-targets:
    needs: check
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    strategy:
      matrix:
        target: [bun-linux-x64, bun-linux-arm64, bun-darwin-x64, bun-darwin-arm64, bun-windows-x64]
        include:
          - target: bun-darwin-x64
            runner: macos-15-intel
          - target: bun-darwin-arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@v4
        with:
          name: standalone-build-inputs
          path: .
      - run: bun install --frozen-lockfile
      - name: Compile the qualified inputs for this target
        run: bun scripts/compile-binary.ts
        env:
          BUN_BUILD_TARGET: ${{ matrix.target }}
      - name: Test native macOS installation
        if: runner.os == 'macOS'
        run: bun test tests/build-macos-installer.test.ts tests/install-macos.test.ts
      - name: Verify the macOS binary starts
        if: runner.os == 'macOS'
        run: |
          test "$(./dist/tsci --version)" = "$(bun -p 'require("./package.json").version')"
          ./dist/tsci --help
      - name: Install GNU tar for deterministic macOS archives
        if: runner.os == 'macOS'
        run: |
          brew install gnu-tar
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Package the binary and redistribution notices
        run: bun scripts/package-release.ts
        env:
          BUN_BUILD_TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: tscircuit-standalone-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 3

  windows-installer:
    needs: build-targets
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@v4
        with:
          name: tscircuit-standalone-bun-windows-x64
          path: windows-release
      - name: Restore the qualified Windows executable and notices
        shell: pwsh
        run: Expand-Archive windows-release/tscircuit-standalone-windows-x64.zip -DestinationPath dist
      - name: Install the checksum-pinned Inno Setup compiler
        shell: pwsh
        run: ./scripts/windows-installer/install-compiler.ps1 -Destination "$env:RUNNER_TEMP/InnoSetup"
      - name: Build the standard Windows installer
        shell: pwsh
        run: |
          $version = & ./dist/tsci.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'The qualified Windows executable did not start' }
          "WINDOWS_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          bun scripts/build-windows-installer.ts dist/tsci.exe "$version" dist/release/tscircuit-standalone-windows-x64-setup.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer compilation failed' }
      - name: Verify install, existing npm commands, upgrades, rollback and uninstall
        shell: pwsh
        run: ./scripts/windows-installer/smoke.ps1 -Installer dist/release/tscircuit-standalone-windows-x64-setup.exe -Binary dist/tsci.exe -Version "$env:WINDOWS_RELEASE_VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: tscircuit-standalone-windows-installer
          path: dist/release/tscircuit-standalone-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 3
