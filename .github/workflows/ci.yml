name: Windows helper module-path regression
on:
  workflow_dispatch:
  push:
    branches: [diagnose/windows-installer-hang-47]
permissions:
  contents: read
jobs:
  regression:
    runs-on: windows-2025
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install pinned Inno Setup
        shell: pwsh
        run: ./scripts/windows-installer/install-compiler.ps1 -Destination "$env:RUNNER_TEMP/InnoSetup"
      - name: Build small native startup probes
        run: bun .github/scripts/build-module-probes.ts
      - name: Compare inherited PowerShell module handling
        shell: node {0}
        run: require(process.env.GITHUB_WORKSPACE + '/.github/scripts/test-module-probes.cjs')
