name: Check standalone preparation
run-name: Validate Developer ID Installer credentials
on:
  workflow_dispatch:
    inputs:
      tscircuit_version:
        description: Unused for this credential validation
        required: false
        type: string
permissions:
  contents: read
jobs:
  installer-credentials:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 55e8503d837732ba2f97be315eac4bc4f1a0e847
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Validate certificate import and package signing
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test -n "$CERTIFICATE_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          directory="$(mktemp -d "$RUNNER_TEMP/tsci-installer-credentials.XXXXXX")"
          keychain="$directory/signing.keychain-db"
          original=()
          while IFS= read -r path; do
            [ -z "$path" ] || original+=("$path")
          done < <(security list-keychains -d user | sed -e 's/^[[:space:]]*"//' -e 's/"[[:space:]]*$//')
          cleanup() {
            result=$?
            security list-keychains -d user -s "${original[@]}" >/dev/null 2>&1 || result=1
            security delete-keychain "$keychain" >/dev/null 2>&1 || true
            rm -rf "$directory"
            exit "$result"
          }
          trap cleanup EXIT
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$directory/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" "${original[@]}"
          security import "$directory/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/productsign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" >/dev/null
          curl --fail --silent --show-error --retry 3 https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$directory/intermediate.cer"
          curl --fail --silent --show-error --retry 3 https://www.apple.com/appleca/AppleIncRootCertificate.cer -o "$directory/root.cer"
          for certificate in intermediate root; do
            if ! security import "$directory/$certificate.cer" -k "$keychain" 2> "$directory/import-error.txt"; then
              grep -F 'The specified item already exists in the keychain' "$directory/import-error.txt"
            fi
          done
          identity="$(security find-identity -v "$keychain" | awk '/Developer ID Installer:/ && /\(WUQ9WUY75Z\)/ {print $2}')"
          [[ "$identity" =~ ^[0-9A-Fa-f]{40}$ ]]
          printf 'int main(void) { return 0; }\n' > "$directory/main.c"
          cc "$directory/main.c" -o "$directory/tsci"
          printf '{"validation":true}\n' > "$directory/licenses.json"
          printf 'Credential validation fixture\n' > "$directory/THIRD_PARTY_NOTICES.txt"
          architecture="$(uname -m)"
          if [ "$architecture" = x86_64 ]; then architecture=x64; fi
          bun scripts/build-macos-installer.ts "$directory/tsci" 0.0.3003 "$architecture" "$directory/unsigned.pkg"
          productsign --sign "$identity" --keychain "$keychain" --timestamp "$directory/unsigned.pkg" "$directory/signed.pkg"
          pkgutil --check-signature "$directory/signed.pkg" | tee "$directory/verification.txt"
          grep -F 'Developer ID Installer: tscircuit Inc. (WUQ9WUY75Z)' "$directory/verification.txt"
          grep -F 'Signed with a trusted timestamp' "$directory/verification.txt"
