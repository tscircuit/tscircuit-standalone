name: Check standalone preparation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tscircuit_version:
        description: Optional upstream version to qualify without publishing
        required: false
        type: string
  workflow_call:
    inputs:
      tscircuit_version:
        description: Upstream tscircuit version to prepare for a daily release
        required: false
        type: string
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - name: Prepare the selected tscircuit release
        if: inputs.tscircuit_version != ''
        env:
          TSCIRCUIT_VERSION: ${{ inputs.tscircuit_version }}
        run: bun scripts/prepare-release.ts "$TSCIRCUIT_VERSION"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: Install the qualification browser
        run: bunx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/build/playwright
      - name: Verify JS CDN modules and WASM with only loopback networking
        run: |
          sudo unshare --net env PATH="$PATH" PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" CI_BROWSER_USER="$(id -un)" sh -c 'ip link set lo up; exec runuser -u "$CI_BROWSER_USER" -- env PATH="$PATH" PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" bun scripts/smoke-binary.ts --browser'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/build/playwright
      - name: Save the qualified dependencies and JS CDN for all target builds
        uses: actions/upload-artifact@v4
        with:
          name: standalone-build-inputs
          path: |
            package.json
            ui/package.json
            bun.lock
            lib/generated-jscdn-assets.ts
            build/jscdn
            build/jscdn-metafile.json
          if-no-files-found: error
          retention-days: 3
  build-targets:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [bun-linux-x64, bun-linux-arm64, bun-darwin-x64, bun-darwin-arm64, bun-windows-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: actions/download-artifact@v4
        with:
          name: standalone-build-inputs
          path: .
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Install the pinned shared CLI build dependencies
        run: bun install --frozen-lockfile --ignore-scripts
        working-directory: node_modules/@tscircuit/cli
      - name: Compile the qualified inputs for this target
        run: bun scripts/compile-binary.ts
        env:
          BUN_BUILD_TARGET: ${{ matrix.target }}
      - name: Package the binary and redistribution notices
        run: bun scripts/package-release.ts
        env:
          BUN_BUILD_TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: tscircuit-standalone-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 3
