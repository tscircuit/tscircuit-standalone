name: Check standalone preparation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
      - name: Install the qualification browser
        run: bunx playwright install --with-deps chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/build/playwright
      - name: Verify compiled RunFrame with only loopback networking
        run: |
          sudo unshare --net env PATH="$PATH" PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" SMOKE_ARTIFACT_DIR="$SMOKE_ARTIFACT_DIR" DEBUG="$DEBUG" CI_BROWSER_USER="$(id -un)" sh -c 'ip link set lo up; exec runuser -u "$CI_BROWSER_USER" -- env PATH="$PATH" PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" SMOKE_ARTIFACT_DIR="$SMOKE_ARTIFACT_DIR" DEBUG="$DEBUG" bun scripts/smoke-dev-browser.ts'
        env:
          DEBUG: pw:browser
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/build/playwright
          SMOKE_ARTIFACT_DIR: build/browser-evidence
      - name: Verify imports and circuit builds make no native network attempts
        run: |
          if ! command -v strace >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y strace
          fi
          binary="$PWD/dist/tsci"
          examples="$PWD/examples"
          project_dir="$(mktemp -d)"
          cp -R "$examples" "$project_dir/examples"
          cd "$project_dir"
          strace -f -e trace=network -o import.trace "$binary" import C2040
          if strace -f -e trace=network -o missing.trace "$binary" import C999999999; then
            exit 1
          fi
          mkdir src
          sed -e 's|"./helpers/pad-testpoint"|"../examples/helpers/pad-testpoint"|' -e 's|"./imports/C2040"|"../imports/C2040"|' examples/rp2040-breakout.circuit.tsx > src/imported-rp2040.circuit.tsx
          strace -f -e trace=network -o generated-import.trace "$binary" build src/imported-rp2040.circuit.tsx
          for circuit in led-resistor rp2040-breakout supplier-footprint wifi-camera-carrier; do
            strace -f -e trace=network -o "$circuit.trace" "$binary" build "examples/$circuit.circuit.tsx"
          done
          printf '%s\n' 'import Missing from "unbundled-example-package"; export default Missing' > missing-module.tsx
          printf '%s\n' 'export default () => <board width="10mm" height="10mm"><chip name="U1" footprint="https://example.invalid/footprint.json"/></board>' > remote-footprint.tsx
          for circuit in missing-module remote-footprint; do
            if strace -f -e trace=network -o "$circuit.trace" "$binary" build "$circuit.tsx" --output-dir "$circuit-output"; then
              exit 1
            fi
            test ! -e "$circuit-output"
          done
          if grep -E 'socket\(AF_INET6?|connect\(|sendto\(|sendmsg\(' ./*.trace; then
            echo "Unexpected native network attempt"
            exit 1
          fi
      - name: Verify the binary in a network namespace
        run: |
          binary="$PWD/dist/tsci"
          examples="$PWD/examples"
          project_dir="$(mktemp -d)"
          cp -R "$examples" "$project_dir/examples"
          cd "$project_dir"
          sudo unshare --net env PATH=/nonexistent BUN_INSTALL_AUTO=disable "$binary" import C2040
          test -s imports/C2040.tsx
          mkdir src
          sed -e 's|"./helpers/pad-testpoint"|"../examples/helpers/pad-testpoint"|' -e 's|"./imports/C2040"|"../imports/C2040"|' examples/rp2040-breakout.circuit.tsx > src/imported-rp2040.circuit.tsx
          sudo unshare --net env -i PATH=/nonexistent BUN_INSTALL_AUTO=disable "$binary" build src/imported-rp2040.circuit.tsx
          test -s build/imported-rp2040.circuit.json
          for circuit in led-resistor rp2040-breakout supplier-footprint wifi-camera-carrier; do
            sudo unshare --net env -i PATH=/nonexistent BUN_INSTALL_AUTO=disable "$binary" build "examples/$circuit.circuit.tsx"
            test -s "build/$circuit.circuit.json"
            grep -q 'data-schematic-component-id' "build/$circuit.circuit.schematic.svg"
          done
      - name: Qualify the camera carrier with only loopback networking
        run: |
          sudo unshare --net env PATH="$PATH" PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" SMOKE_ARTIFACT_DIR="$SMOKE_ARTIFACT_DIR" CI_BROWSER_USER="$(id -un)" sh -c 'ip link set lo up; exec runuser -u "$CI_BROWSER_USER" -- env PATH="$PATH" PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" SMOKE_ARTIFACT_DIR="$SMOKE_ARTIFACT_DIR" bun scripts/smoke-wifi-camera.ts'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/build/playwright
          SMOKE_ARTIFACT_DIR: build/browser-evidence/wifi-camera
      - name: Qualify the bare-chip Wi-Fi camera with only loopback networking
        run: |
          sudo unshare --net env PATH="$PATH" PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" SMOKE_ARTIFACT_DIR="$SMOKE_ARTIFACT_DIR" CI_BROWSER_USER="$(id -un)" sh -c 'ip link set lo up; exec runuser -u "$CI_BROWSER_USER" -- env PATH="$PATH" PLAYWRIGHT_BROWSERS_PATH="$PLAYWRIGHT_BROWSERS_PATH" SMOKE_ARTIFACT_DIR="$SMOKE_ARTIFACT_DIR" bun scripts/smoke-discrete-wifi-camera.ts'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/build/playwright
          SMOKE_ARTIFACT_DIR: build/browser-evidence/discrete-wifi-camera
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-runframe-browser-evidence
          path: build/browser-evidence
          if-no-files-found: ignore
  build-targets:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [bun-linux-x64, bun-linux-arm64, bun-darwin-x64, bun-darwin-arm64, bun-windows-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
        env:
          BUN_BUILD_TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: tscircuit-standalone-${{ matrix.target }}
          path: |
            dist/tsci*
            dist/licenses.json
            dist/THIRD_PARTY_NOTICES.txt
            LICENSE
            THIRD_PARTY_NOTICES
