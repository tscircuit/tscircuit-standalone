name: Daily standalone release

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      manual_release:
        description: Publish a uniquely tagged manual prerelease
        type: boolean
        default: false
      tscircuit_version:
        description: Exact upstream version or latest
        type: string
        default: latest
    secrets:
      MACOS_CERTIFICATE_P12_BASE64:
        required: true
      MACOS_CERTIFICATE_PASSWORD:
        required: true
      APPLE_NOTARY_KEY_P8_BASE64:
        required: true
      APPLE_NOTARY_KEY_ID:
        required: true
      APPLE_NOTARY_ISSUER_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: standalone-daily-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'tscircuit/tscircuit-standalone' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - name: Choose the tscircuit version and skip published dates
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MANUAL_RELEASE: ${{ inputs.manual_release || false }}
          REQUESTED_VERSION: ${{ inputs.tscircuit_version || 'latest' }}
        run: |
          release_date="$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID" --jq '.created_at[:10]')"
          if [[ ! "$release_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "The workflow run did not provide a valid release date."
            exit 1
          fi
          requested_version="${REQUESTED_VERSION:-latest}"
          if [[ "$requested_version" != "latest" && ! "$requested_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected an exact tscircuit version or latest."
            exit 1
          fi
          tag="daily-$release_date"
          if [[ "${MANUAL_RELEASE:-false}" == "true" ]]; then
            tag="manual-$release_date-$GITHUB_RUN_ID"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh api "repos/$GH_REPO/releases/tags/$tag" > release.json 2> release-error.txt; then
            if jq -e '.draft == false' release.json > /dev/null; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "$tag is already published; leaving it unchanged."
              exit 0
            fi
            if ! jq -e --arg sha "$GITHUB_SHA" '.target_commitish == $sha' release.json > /dev/null; then
              echo "The existing release draft belongs to a different source commit. Rerun its original workflow."
              exit 1
            fi
            if jq -e 'any(.assets[]?; .name == "release-manifest.json")' release.json > /dev/null; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "$tag is awaiting notarization; use Check pending notarizations to continue."
              exit 0
            fi
            version="$(jq -er '.name | select(startswith("tscircuit standalone ")) | ltrimstr("tscircuit standalone ")' release.json)"
          elif grep -q 'HTTP 404' release-error.txt; then
            version="$(curl --fail --silent --show-error --retry 3 "https://registry.npmjs.org/tscircuit/$requested_version" | jq -er '.version')"
          else
            cat release-error.txt
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "The release did not provide a valid tscircuit version."
            exit 1
          fi
          if [[ "$requested_version" != "latest" && "$version" != "$requested_version" ]]; then
            echo "The selected release version does not match the requested version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      tscircuit_version: ${{ needs.prepare.outputs.version }}


  draft:
    needs: [prepare, build]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@v4
        with:
          pattern: tscircuit-standalone-*
          path: dist/release
          merge-multiple: true
      - name: Save the draft and non-Mac assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
        run: bun scripts/release-queue.ts init

  sign-macos:
    needs: [prepare, build, draft]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    env:
      ARCH: ${{ matrix.arch }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      SOURCE_SHA: ${{ github.sha }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Recover a submission saved by an earlier attempt
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: submitted-macos-${{ matrix.arch }}
          path: dist/release
      - name: Restore an existing signed submission on retries
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release-queue.ts restore-macos
      - uses: actions/download-artifact@v4
        if: steps.restore.outputs.reused != 'true'
        with:
          name: tscircuit-standalone-bun-darwin-${{ matrix.arch }}
          path: unsigned
      - name: Restore the qualified executable and license inventory
        if: steps.restore.outputs.reused != 'true'
        run: |
          mkdir -p dist
          tar -xzf "unsigned/tscircuit-standalone-macos-$ARCH.tar.gz" -C dist
          cmp "unsigned/tsci-darwin-$ARCH" dist/tsci
          cmp LICENSE dist/LICENSE
          cmp THIRD_PARTY_NOTICES dist/THIRD_PARTY_NOTICES
          chmod +x dist/tsci
      - name: Sign and submit to Apple without waiting
        if: steps.restore.outputs.reused != 'true'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: WUQ9WUY75Z
        run: bash scripts/sign-macos.sh dist/tsci
      - name: Install GNU tar for deterministic archives
        if: steps.restore.outputs.reused != 'true'
        run: |
          brew install gnu-tar
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Package the signed executable and submission
        if: steps.restore.outputs.reused != 'true'
        env:
          BUN_BUILD_TARGET: bun-darwin-${{ matrix.arch }}
        run: |
          bun scripts/package-release.ts
          cp dist/tsci.notarization.json "dist/release/tsci-darwin-$ARCH.notarization.json"
      - name: Save a recovery copy before uploading the draft
        if: steps.restore.outputs.reused != 'true'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: submitted-macos-${{ matrix.arch }}
          path: dist/release/*
          overwrite: true
          retention-days: 30
      - name: Persist the signed files and Apple submission ID
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release-queue.ts save-macos

  stage:
    needs: [prepare, draft, sign-macos]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Mark the complete draft as awaiting notarization
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          BUILD_KIND: ${{ inputs.manual_release && 'Manual' || 'Daily' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bun scripts/release-queue.ts seal

  check:
    needs: [prepare, stage]
    uses: ./.github/workflows/check-notarization.yml
    permissions:
      contents: write
      actions: read
    with:
      release_tag: ${{ needs.prepare.outputs.tag }}
    secrets:
      APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
