name: Validate macOS Developer ID signing
on:
  push:
    branches: [codex/macos-developer-id-notarization]
    paths: [.github/workflows/validate-macos-signing.yml]
permissions:
  contents: read
jobs:
  sign:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download and verify the current public release
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          release_url=https://github.com/tscircuit/tscircuit-standalone/releases/download/manual-2026-10-20-39407786632
          archive="tscircuit-standalone-macos-$ARCH.tar.gz"
          curl --fail --location --silent --show-error --retry 3 "$release_url/SHA256SUMS" -o SHA256SUMS
          curl --fail --location --silent --show-error --retry 3 "$release_url/$archive" -o "$archive"
          awk -v archive="$archive" '$2 == archive {print; count++} END {if(count != 1) exit 1}' SHA256SUMS > selected-checksum
          shasum -a 256 --check selected-checksum
          mkdir dist
          tar -xzf "$archive" -C dist
          chmod +x dist/tsci
      - name: Sign and require Apple notarization
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: WUQ9WUY75Z
        run: bash scripts/sign-macos.sh dist/tsci
      - name: Exercise the signed executable natively
        run: |
          test "$(./dist/tsci --version)" = 0.0.2969
          ./dist/tsci --help
          ./dist/tsci build examples/led-resistor.circuit.tsx --ignore-errors --concurrency 2 --pcb-png
      - uses: actions/upload-artifact@v4
        with:
          name: validation-signed-macos-${{ matrix.arch }}
          path: |
            dist/tsci
            dist/tsci.notarization.json
          if-no-files-found: error
          retention-days: 3
