name: Finalize notarized release
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Pending release tag to verify and publish
        type: string
        required: true
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
    secrets:
      APPLE_NOTARY_KEY_P8_BASE64:
        required: true
      APPLE_NOTARY_KEY_ID:
        required: true
      APPLE_NOTARY_ISSUER_ID:
        required: true
permissions:
  contents: read
concurrency:
  group: finalize-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  inspect:
    if: github.repository == 'tscircuit/tscircuit-standalone' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ready: ${{ steps.plan.outputs.ready }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      version: ${{ steps.plan.outputs.version }}
      kind: ${{ steps.plan.outputs.kind }}
      run_url: ${{ steps.plan.outputs.run_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Recheck acceptance and pin the finalization inputs
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PLAN_FILE: release-plan.json
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: bun scripts/release-queue.ts plan
      - name: Restore accepted Mac inputs for the verification runners
        if: steps.plan.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLAN_FILE: release-plan.json
        run: |
          for arch in x64 arm64; do
            ARCH="$arch" RELEASE_DIR="dist/$arch" bun scripts/release-queue.ts download
          done
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.ready == 'true'
        with:
          name: macos-input-${{ inputs.release_tag }}-x64
          path: dist/x64/*
          overwrite: true
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.ready == 'true'
        with:
          name: macos-input-${{ inputs.release_tag }}-arm64
          path: dist/arm64/*
          overwrite: true
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: steps.plan.outputs.ready == 'true'
        with:
          name: release-plan-${{ inputs.release_tag }}
          path: release-plan.json
          overwrite: true
          retention-days: 7
  verify-macos:
    needs: inspect
    if: needs.inspect.outputs.ready == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.source_sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@v4
        with:
          name: release-plan-${{ inputs.release_tag }}
      - uses: actions/download-artifact@v4
        with:
          name: macos-input-${{ inputs.release_tag }}-${{ matrix.arch }}
          path: dist/release
      - name: Verify Apple's ticket and exercise the signed binary
        env:
          ARCH: ${{ matrix.arch }}
          EXPECTED_VERSION: ${{ needs.inspect.outputs.version }}
        run: |
          for asset in "tsci-darwin-$ARCH" "tsci-darwin-$ARCH.notices.txt" "tscircuit-standalone-macos-$ARCH.tar.gz"; do
            expected="$(jq -er --arg asset "$asset" '.manifest.files[$asset]' release-plan.json)"
            test "$(shasum -a 256 "dist/release/$asset" | cut -d ' ' -f 1)" = "$expected"
          done
          cp "dist/release/tsci-darwin-$ARCH" dist/tsci
          chmod +x dist/tsci
          codesign --verify --strict --check-notarization -R='notarized' dist/tsci
          codesign --display --verbose=4 dist/tsci 2> signature.txt
          grep -Fx 'TeamIdentifier=WUQ9WUY75Z' signature.txt
          grep -F 'Authority=Developer ID Application:' signature.txt
          test "$(./dist/tsci --version)" = "$EXPECTED_VERSION"
          ./dist/tsci --help
          ./dist/tsci build examples/led-resistor.circuit.tsx --ignore-errors --concurrency 2 --pcb-png
      - uses: actions/upload-artifact@v4
        with:
          name: verified-macos-${{ inputs.release_tag }}-${{ matrix.arch }}
          path: dist/release/*
          overwrite: true
          retention-days: 7
  publish:
    needs: [inspect, verify-macos]
    if: needs.inspect.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@v4
        with:
          name: release-plan-${{ inputs.release_tag }}
      - name: Restore all saved release assets and verify their hashes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLAN_FILE: release-plan.json
        run: bun scripts/release-queue.ts download
      - uses: actions/download-artifact@v4
        with:
          name: verified-macos-${{ inputs.release_tag }}-x64
          path: dist/release
      - uses: actions/download-artifact@v4
        with:
          name: verified-macos-${{ inputs.release_tag }}-arm64
          path: dist/release
      - name: Verify the release assets and generate checksums
        working-directory: dist/release
        run: |
          assets=(
            release-manifest.json
            tsci-linux-x64
            tsci-linux-arm64
            tsci-darwin-x64
            tsci-darwin-arm64
            tsci-windows-x64.exe
            tsci-linux-x64.notices.txt
            tsci-linux-arm64.notices.txt
            tsci-darwin-x64.notices.txt
            tsci-darwin-arm64.notices.txt
            tsci-windows-x64.notices.txt
            tscircuit-standalone-linux-x64.tar.gz
            tscircuit-standalone-linux-arm64.tar.gz
            tscircuit-standalone-macos-x64.tar.gz
            tscircuit-standalone-macos-arm64.tar.gz
            tscircuit-standalone-windows-x64.zip
            tsci-darwin-x64.notarization.json
            tsci-darwin-arm64.notarization.json
          )
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          for arch in x64 arm64; do
            binary="tsci-darwin-$arch"
            checksum="$(sha256sum "$binary" | cut -d ' ' -f 1)"
            jq -e --arg checksum "$checksum" \
              '.status == "Accepted" and .teamId == "WUQ9WUY75Z" and .sha256 == $checksum and (.id | type == "string" and length > 0)' \
              "$binary.notarization.json" > /dev/null
            test "$(tar -xOzf "tscircuit-standalone-macos-$arch.tar.gz" tsci | sha256sum | cut -d ' ' -f 1)" = "$checksum"
          done
          sha256sum "${assets[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Publish the complete daily prerelease
        working-directory: dist/release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_VERSION: ${{ needs.inspect.outputs.version }}
          SOURCE_SHA: ${{ needs.inspect.outputs.source_sha }}
          BUILD_KIND: ${{ needs.inspect.outputs.kind }}
          RUN_URL: ${{ needs.inspect.outputs.run_url }}
        run: |
          download_url="https://github.com/$GH_REPO/releases/download/$RELEASE_TAG"
          cat > release-notes.md <<EOF
          ${BUILD_KIND:-Daily} development build of tscircuit standalone, based on tscircuit $RELEASE_VERSION.

          ## Download a binary

          Download a binary and its notices file. Archives are optional. On macOS/Linux,
          rename the binary to tsci and run chmod +x tsci.

          | Platform | Binary | Notices |
          | --- | --- | --- |
          | Linux x64 | [tsci-linux-x64]($download_url/tsci-linux-x64) | [Notices]($download_url/tsci-linux-x64.notices.txt) |
          | Linux arm64 | [tsci-linux-arm64]($download_url/tsci-linux-arm64) | [Notices]($download_url/tsci-linux-arm64.notices.txt) |
          | macOS Intel | [tsci-darwin-x64]($download_url/tsci-darwin-x64) | [Notices]($download_url/tsci-darwin-x64.notices.txt) |
          | macOS Apple Silicon | [tsci-darwin-arm64]($download_url/tsci-darwin-arm64) | [Notices]($download_url/tsci-darwin-arm64.notices.txt) |
          | Windows x64 | [tsci-windows-x64.exe]($download_url/tsci-windows-x64.exe) | [Notices]($download_url/tsci-windows-x64.notices.txt) |

          Version: $RELEASE_VERSION
          Source commit: $SOURCE_SHA
          [Build and qualification results]($RUN_URL)

          ### macOS terminal installation

          Both macOS binaries are signed with tscircuit Inc.'s Developer ID and
          accepted by Apple's notarization service. Browser downloads can retain
          quarantine metadata; leave it in place so Gatekeeper can verify them.
          The checksum-verified terminal installer is also available:

          ~~~sh
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/$GH_REPO/$SOURCE_SHA/scripts/install-macos.sh | sh -s -- $RELEASE_TAG
          ./tscircuit-standalone-$RELEASE_TAG/tsci --version
          ~~~

          The installer selects Apple Silicon or Intel automatically. No Apple
          account, Bun/Node or sudo is required. Standalone executables cannot
          have notarization tickets stapled to them, so the first Gatekeeper
          check needs internet access. Older unsigned releases are unchanged.
          See [macOS download verification](https://github.com/$GH_REPO/blob/$SOURCE_SHA/docs/releases.md#macos-download-quarantine).

          Each archive contains tsci, project licenses and generated dependency notices.
          Compiled dependency versions are recorded in licenses.json and the companion notices.
          SHA256SUMS covers all binaries, notices and archives. The same build-time datasheet catalog and
          UI bundle are embedded in every target. Runtime part imports, circuit builds
          and the local UI use the embedded resources without outbound requests.

          Linux x64 passes native and browser qualification. Both macOS targets
          pass native startup checks after signing and notarization. Linux arm64
          and Windows artifacts have cross-compilation coverage.
          EOF
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > tag-ref.json 2> tag-error.txt; then
            while [ "$(jq -er '.object.type' tag-ref.json)" = "tag" ]; do
              tag_sha="$(jq -er '.object.sha' tag-ref.json)"
              gh api "repos/$GH_REPO/git/tags/$tag_sha" > tag-ref.json
            done
            if ! jq -e --arg sha "$SOURCE_SHA" '.object.type == "commit" and .object.sha == $sha' tag-ref.json > /dev/null; then
              echo "The release tag points to a different source commit; refusing to publish."
              exit 1
            fi
          elif ! grep -q 'HTTP 404' tag-error.txt; then
            cat tag-error.txt
            exit 1
          fi
          if gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > existing-release.json 2> release-error.txt; then
            if jq -e '.draft == false' existing-release.json > /dev/null; then
              echo "$RELEASE_TAG is already published; leaving it unchanged."
              exit 0
            fi
            jq -e --arg sha "$SOURCE_SHA" --arg name "tscircuit standalone $RELEASE_VERSION" '.draft == true and .target_commitish == $sha and .name == $name' existing-release.json > /dev/null
          elif grep -q 'HTTP 404' release-error.txt; then
            gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --draft --prerelease \
              --title "tscircuit standalone $RELEASE_VERSION" --notes-file release-notes.md
          else
            cat release-error.txt
            exit 1
          fi
          assets=()
          while read -r checksum asset; do
            assets+=("$asset")
          done < SHA256SUMS
          gh release upload "$RELEASE_TAG" "${assets[@]}" SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false --notes-file release-notes.md
