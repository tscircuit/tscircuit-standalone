name: Sign Windows executable and installer

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign:
    runs-on: windows-2025
    environment: windows-signing
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/download-artifact@v4
        with:
          name: tscircuit-standalone-bun-windows-x64
          path: unsigned
      - name: Restore the qualified Windows executable and notices
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Expand-Archive -LiteralPath unsigned/tscircuit-standalone-windows-x64.zip -DestinationPath dist
          if ((Get-FileHash unsigned/tsci-windows-x64.exe).Hash -cne (Get-FileHash dist/tsci.exe).Hash) {
            throw "Qualified executable mismatch"
          }
          # Compare committed bytes; Windows checkout may convert text to CRLF.
          foreach ($notice in @("LICENSE", "THIRD_PARTY_NOTICES")) {
            $expected = git rev-parse "HEAD:$notice"
            if ($LASTEXITCODE -ne 0) { throw "Missing committed notice: $notice" }
            $actual = git hash-object --no-filters "dist/$notice"
            if ($LASTEXITCODE -ne 0 -or $actual -cne $expected) { throw "Qualified input mismatch: $notice" }
          }
      - name: Verify the unsigned executable and embedded worker run on Windows
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: ./tests/windows-cli.ps1 -Path ./dist/tsci.exe -ExpectedVersion $env:EXPECTED_VERSION
      - name: Cache the pinned Microsoft signing module
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ~/Documents/PowerShell/Modules/ArtifactSigning/0.1.8
          key: windows-ArtifactSigning-0.1.8
      - name: Install the Microsoft signing module with retries
        shell: pwsh
        run: ./scripts/install-windows-signing.ps1
      - name: Authenticate to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign and timestamp the Windows executable
        shell: pwsh
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: ./scripts/windows-installer/sign.ps1 -Path ./dist/tsci.exe
      - name: Verify Authenticode and reject changed or unexpected signatures
        shell: pwsh
        run: ./tests/windows-signature.ps1 -Path ./dist/tsci.exe
      - name: Verify the signed executable and embedded worker run on Windows
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: ./tests/windows-cli.ps1 -Path ./dist/tsci.exe -ExpectedVersion $env:EXPECTED_VERSION
      - name: Install the checksum-pinned Inno Setup compiler
        shell: pwsh
        run: ./scripts/windows-installer/install-compiler.ps1 -Destination "$env:RUNNER_TEMP/InnoSetup"
      - name: Build and sign the installer and uninstaller
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:WINDOWS_INSTALLER_SIGN_COMMAND = '$q{0}$q -NoProfile -NonInteractive -File $q{1}$q -Path $f' -f (Get-Command pwsh).Source, (Resolve-Path scripts/windows-installer/sign.ps1).Path
          bun scripts/build-windows-installer.ts dist/tsci.exe "$env:EXPECTED_VERSION" dist/release/tscircuit-standalone-windows-x64-setup.exe
          if ($LASTEXITCODE -ne 0) { throw 'Signed installer compilation failed' }
      - name: Verify signed installation, upgrades, PATH rollback and uninstall
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: ./scripts/windows-installer/smoke.ps1 -Installer dist/release/tscircuit-standalone-windows-x64-setup.exe -Binary dist/tsci.exe -Version "$env:EXPECTED_VERSION" -RequireSigned -SigningReceipt "$env:RUNNER_TEMP/windows-uninstaller-signing.json"
      - name: Package the verified signed executable
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: ./scripts/package-signed-windows.ps1 -Notices unsigned/tsci-windows-x64.notices.txt -ExpectedVersion $env:EXPECTED_VERSION -UninstallerReceipt "$env:RUNNER_TEMP/windows-uninstaller-signing.json"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-windows-x64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 3
