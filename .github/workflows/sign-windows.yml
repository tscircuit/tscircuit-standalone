name: Sign Windows executable

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign:
    runs-on: windows-2025
    environment: windows-signing
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: tscircuit-standalone-bun-windows-x64
          path: unsigned
      - name: Restore the qualified Windows executable and notices
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Expand-Archive -LiteralPath unsigned/tscircuit-standalone-windows-x64.zip -DestinationPath dist
          if ((Get-FileHash unsigned/tsci-windows-x64.exe).Hash -cne (Get-FileHash dist/tsci.exe).Hash) {
            throw "Qualified executable mismatch"
          }
          # Compare committed bytes; Windows checkout may convert text to CRLF.
          foreach ($notice in @("LICENSE", "THIRD_PARTY_NOTICES")) {
            $expected = git rev-parse "HEAD:$notice"
            if ($LASTEXITCODE -ne 0) { throw "Missing committed notice: $notice" }
            $actual = git hash-object --no-filters "dist/$notice"
            if ($LASTEXITCODE -ne 0 -or $actual -cne $expected) { throw "Qualified input mismatch: $notice" }
          }
      - name: Authenticate to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign and timestamp the Windows executable
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\dist\tsci.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-azure-cli-credential: false
      - name: Verify Authenticode and reject changed or unexpected signatures
        shell: pwsh
        run: ./tests/windows-signature.ps1 -Path ./dist/tsci.exe
      - name: Verify the signed executable and embedded worker run on Windows
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $binary = (Resolve-Path dist/tsci.exe).Path
          $version = & $binary --version
          if ($LASTEXITCODE -ne 0 -or "$version".Trim() -cne $env:EXPECTED_VERSION) { throw "Signed executable version mismatch" }
          & $binary --help
          if ($LASTEXITCODE -ne 0) { throw "Signed executable could not start" }
          & $binary build examples/led-resistor.circuit.tsx --ignore-errors --concurrency 2 --pcb-png
          if ($LASTEXITCODE -ne 0) { throw "Signed executable worker/WASM check failed" }
      - name: Package the verified signed executable
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: ./scripts/package-signed-windows.ps1 -Notices unsigned/tsci-windows-x64.notices.txt -ExpectedVersion $env:EXPECTED_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: signed-windows-x64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 3
